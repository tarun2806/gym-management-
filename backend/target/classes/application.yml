spring:
  application:
    name: gympro-api
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/gympro?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:gympro}
    password: ${DB_PASSWORD:gympro}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8090}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  # Path to a Firebase service-account JSON for Admin SDK token verification.
  # Never commit the file; provide via env var in deployed environments.
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

# One-shot Firestore->MySQL import. Point at an export-firestore.mjs output dir.
# Leave unset to disable the importer entirely.
migration:
  import-dir: ${MIGRATION_IMPORT_DIR:}
