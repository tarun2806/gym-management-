services:
  mysql:
    image: mysql:8.4
    container_name: gympro-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gympro
      MYSQL_USER: gympro
      MYSQL_PASSWORD: gympro
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - gympro-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ugympro", "-pgympro"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  gympro-mysql-data:
